name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose

  cuda-scaffolding:
    name: build --features cuda (compile only, no GPU on CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrox-cuda --features cuda --verbose

  # CONTRIBUTING.md: the cuda feature must keep compiling without a GPU
  # or CUDA toolkit present through the full CLI/server dependency chain.
  cuda-feature-chain:
    name: clippy/build --features cuda (cli + server chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrox-cli -p ferrox-server --features cuda --verbose
      - run: cargo clippy -p ferrox-cli -p ferrox-server --features cuda -- -D warnings

  # Metal kernels are Apple-only; compile the feature chain on macOS.
  # Hardware-only tests remain #[ignore]d (run locally with --ignored).
  metal-feature-chain:
    name: clippy/build --features metal (macos compile only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrox-metal -p ferrox-cli -p ferrox-server --features metal --verbose
      - run: cargo clippy -p ferrox-metal -p ferrox-cli -p ferrox-server --features metal -- -D warnings

  # What the release tarball actually ships.
  #
  # `release.yml` builds the CLI with `serve` (plus `metal` on macOS),
  # and no CI job built that combination: the cuda and metal jobs both
  # leave `serve` off. So a break confined to the `serve` feature would
  # have reached users through the install script with CI green, which
  # is the one path where a compile error is guaranteed to be somebody
  # else's first experience of the project.
  serve-feature-chain:
    name: clippy/build --features serve (what the tarball ships)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: serve metal
          - os: ubuntu-latest
            features: serve
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrox-cli --features "${{ matrix.features }}" --verbose
      - run: cargo clippy -p ferrox-cli --all-targets --features "${{ matrix.features }}" -- -D warnings

  # Ferrox Studio (ui/) is a standalone app: nothing it builds is
  # committed and nothing ships inside a Rust crate, so there is no
  # stale-artefact check to run. What CI does owe this directory is the
  # three gates a Rust reviewer cannot run by reading the diff -- does
  # it typecheck, does it lint, does it build -- plus the licence sweep,
  # which is not a formality: the bundle is DISTRIBUTED, so a copyleft
  # dependency would ship to every viewer, and ferrox is Apache-2.0.
  ui:
    name: ui typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
