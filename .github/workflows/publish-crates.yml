name: Publish to crates.io

# Runs after `release.yml` has built the tarballs for the same tag.
# Publishing is separate on purpose: a crates.io upload is IRREVERSIBLE
# (a version can be yanked, never replaced), so it must not be a side
# effect of pushing a tag that also builds binaries. The tag trigger
# still exists for the normal path, but every run publishes in
# dependency order and stops at the first failure rather than leaving
# half a workspace on the registry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.7.0). Defaults to the current ref."
        required: false
        type: string
      dry_run:
        description: "Package and verify every crate without uploading."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      # A tag that does not match the workspace version would publish
      # the wrong thing under the right name, and that cannot be undone.
      # Checked before anything is uploaded.
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          WS_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferrox-inference") | .version')"
          if [[ "${TAG}" != "v${WS_VERSION}" ]]; then
            echo "::error::tag ${TAG} does not match workspace version ${WS_VERSION}"
            exit 1
          fi
          echo "publishing ${TAG} (workspace ${WS_VERSION})"

      # The gates the repo already runs elsewhere. A crate that does not
      # build must never reach the registry, and unlike a bad binary
      # release this one cannot be replaced.
      - name: Gates
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all --check

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          set -euo pipefail

          # Dependency order. `cargo publish` resolves a path dependency
          # against the REGISTRY once uploaded, so a crate cannot go up
          # before everything it depends on is already there and
          # indexed. Derived by hand from the workspace graph:
          #
          #   api, gguf, quant, safetensors   (no internal deps)
          #   cuda, metal                     <- quant
          #   core                            <- gguf, quant, (cuda, metal)
          #   moe                             <- core, quant
          #   models                          <- core, moe, gguf, quant, safetensors
          #   server                          <- the above
          #   cli                             <- server, for the optional
          #                                      `serve` feature. Publishing
          #                                      cli first fails to resolve
          #                                      ferrox-server at the new
          #                                      version, which is exactly
          #                                      how v0.11.0 broke.
          #   inference                       <- the whole stack
          CRATES=(
            ferrox-api
            ferrox-gguf
            ferrox-quant
            ferrox-safetensors
            ferrox-cuda
            ferrox-metal
            ferrox-core
            ferrox-moe
            ferrox-models
            ferrox-server
            ferrox-cli
            ferrox-inference
          )

          if [[ "${DRY_RUN}" == "1" ]]; then
            echo "DRY RUN, packaging, uploading nothing"
            blocked=0
            for c in "${CRATES[@]}"; do
              echo "::group::dry-run ${c}"
              # --no-verify because a dependent's path deps are not on
              # the registry at this version yet, so a verification
              # build would fail for a reason that has nothing to do
              # with the crate being checked.
              #
              # And packaging itself still resolves against the index,
              # so on a FIRST publish every dependent legitimately
              # fails with "no matching package named ferrox-*". That
              # is the dry run hitting the same ordering constraint the
              # real publish satisfies by uploading as it goes -- it is
              # not a defect in the crate, so it is reported and not
              # treated as a failure. Anything else is a real failure.
              if ! out="$(cargo publish -p "${c}" --dry-run --locked --no-verify 2>&1)"; then
                if grep -q 'no matching package named `ferrox-' <<<"${out}"; then
                  echo "${c}: cannot be packaged until its ferrox-* deps are on crates.io at this version, expected on a first publish"
                  blocked=$((blocked + 1))
                else
                  echo "${out}"
                  echo "::error::${c} failed to package"
                  exit 1
                fi
              else
                echo "${c}: packages cleanly"
              fi
              echo "::endgroup::"
            done
            if [[ "${blocked}" -gt 0 ]]; then
              echo "::notice::${blocked} crate(s) could not be dry-run yet because they depend on workspace crates not on the registry at this version. Re-run the dry run after a real publish to check them."
            fi
            exit 0
          fi

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add it under Settings > Secrets > Actions."
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferrox-inference") | .version')"

          for c in "${CRATES[@]}"; do
            echo "::group::publish ${c} ${version}"

            # Already on the registry at this version? Then this is a
            # re-run of a partially failed publish. Skip rather than
            # fail: the alternative is a workspace that can never be
            # finished, because the first crate always 403s.
            if curl -sf -H "User-Agent: ferrox-ci" \
                 "https://crates.io/api/v1/crates/${c}/${version}" >/dev/null; then
              echo "${c} ${version} is already published, skipping"
              echo "::endgroup::"
              continue
            fi

            cargo publish -p "${c}" --locked

            # crates.io is eventually consistent: the next crate's
            # dependency resolution reads the sparse index, which lags
            # the upload by seconds. Wait for the version to actually
            # appear instead of sleeping a guessed constant.
            echo "waiting for ${c} ${version} to appear in the index"
            for i in $(seq 1 60); do
              if curl -sf -H "User-Agent: ferrox-ci" \
                   "https://crates.io/api/v1/crates/${c}/${version}" >/dev/null; then
                echo "${c} ${version} is live"
                break
              fi
              if [[ "${i}" == "60" ]]; then
                echo "::error::${c} ${version} never appeared in the index after 5 minutes"
                exit 1
              fi
              sleep 5
            done

            echo "::endgroup::"
          done

          echo "published ${#CRATES[@]} crates at ${version}"
