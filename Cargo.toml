[workspace]
members = [
    "crates/ferrox-gguf",
    "crates/ferrox-safetensors",
    "crates/ferrox-quant",
    "crates/ferrox-core",
    "crates/ferrox-moe",
    "crates/ferrox-models",
    "crates/ferrox-cli",
    "crates/ferrox-server",
    "crates/ferrox-cuda",
    "crates/ferrox-metal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/antonellof/ferrox"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
byteorder = "1"
memmap2 = "0.9"
rayon = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
