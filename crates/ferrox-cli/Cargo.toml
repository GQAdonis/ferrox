[package]
name = "ferrox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "llama.cpp-style CLI for the Ferrox inference engine"
readme = "../../README.md"

[[bin]]
name = "ferrox"
path = "src/main.rs"

[dependencies]
ferrox-gguf = { workspace = true }
ferrox-quant = { workspace = true }
ferrox-cuda = { workspace = true }
ferrox-metal = { workspace = true }
half = { workspace = true }
ferrox-core = { workspace = true }
ferrox-models = { workspace = true }
ferrox-safetensors = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }

[features]
default = []
# Must forward to ferrox-models the same way `metal` does, or the CLI
# links a ferrox-core built *without* `cuda` -- no `cuda_dense_enabled`,
# no `apply_gpu` CUDA arm -- and `cargo build -p ferrox-cli --features
# cuda` does not compile at all. Only ever caught on a real CUDA host,
# because CI has none.
cuda = ["ferrox-cuda/cuda", "ferrox-models/cuda"]
# Caps detection + Metal apply_gpu dispatch through ferrox-models.
metal = ["ferrox-metal/metal", "ferrox-models/metal"]
