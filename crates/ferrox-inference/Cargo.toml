[package]
name = "ferrox-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust GGUF / MoE inference engine: mmap loaders, quantized CPU + Metal + CUDA kernels"
readme = "README.md"
keywords = ["llm", "inference", "gguf", "quantization", "moe"]
categories = ["science", "algorithms"]

# The front door on crates.io. `ferrox` itself is taken by an unrelated
# crate, so this is the name the project is published under; it
# re-exports the workspace so a dependent needs one line in Cargo.toml
# instead of six. The binary lives in `ferrox-cli`
# (`cargo install ferrox-cli` installs it as `ferrox`) and is
# deliberately NOT duplicated here -- two crates shipping a binary
# called `ferrox` would fight over the same path in ~/.cargo/bin.

[dependencies]
ferrox-gguf = { workspace = true }
ferrox-quant = { workspace = true }
ferrox-core = { workspace = true }
ferrox-moe = { workspace = true }
ferrox-models = { workspace = true }
ferrox-safetensors = { workspace = true }
ferrox-api = { workspace = true, optional = true }

[features]
default = []
# Route constants and wire DTOs, for writing a client against
# ferrox-server without depending on the server itself.
api = ["dep:ferrox-api"]
# Apple Metal kernels. Apple Silicon only.
metal = ["ferrox-core/metal", "ferrox-models/metal"]
# CUDA/NVRTC kernels. Needs a CUDA toolkit at build time.
cuda = ["ferrox-core/cuda", "ferrox-models/cuda"]
