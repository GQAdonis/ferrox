[package]
name = "ferrox-models"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrox-core = { path = "../ferrox-core" }
ferrox-moe = { path = "../ferrox-moe" }
ferrox-gguf = { path = "../ferrox-gguf" }
ferrox-quant = { path = "../ferrox-quant" }
ferrox-safetensors = { path = "../ferrox-safetensors" }
ferrox-metal = { path = "../ferrox-metal", optional = true }
ferrox-cuda = { path = "../ferrox-cuda", optional = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = "1.13.1"
fancy-regex = "0.18.0"
base64 = "0.23.0"
serde_json.workspace = true

[dev-dependencies]
byteorder = { workspace = true }

[features]
default = []
cuda = ["ferrox-moe/cuda", "dep:ferrox-cuda", "ferrox-cuda/cuda"]
metal = ["ferrox-moe/metal", "dep:ferrox-metal", "ferrox-metal/metal"]
