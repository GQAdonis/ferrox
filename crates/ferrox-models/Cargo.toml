[package]
name = "ferrox-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model loaders and decoder stacks for the Ferrox inference engine"
readme = "../../README.md"

[dependencies]
ferrox-core = { workspace = true }
ferrox-moe = { workspace = true }
ferrox-gguf = { workspace = true }
ferrox-quant = { workspace = true }
ferrox-safetensors = { workspace = true }
ferrox-metal = { workspace = true, optional = true }
ferrox-cuda = { workspace = true, optional = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = "1.13.1"
fancy-regex = "0.18.0"
base64 = "0.23.0"
serde_json.workspace = true

[dev-dependencies]
byteorder = { workspace = true }

[features]
default = []
cuda = ["ferrox-moe/cuda", "dep:ferrox-cuda", "ferrox-cuda/cuda"]
metal = ["ferrox-moe/metal", "dep:ferrox-metal", "ferrox-metal/metal"]
