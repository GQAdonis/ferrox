[package]
name = "ferrox-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vulkan/SPIR-V beachhead for the Ferrox inference engine (GO/NO-GO slice, not a backend)"
readme = "README.md"
keywords = ["vulkan", "spirv", "gpu", "llm", "ferrox"]
categories = ["hardware-support", "science"]
# Published because `ferrox-core` depends on it. Cargo requires every
# dependency of a published crate to be resolvable on the registry,
# optional ones included, so `publish = false` here made `ferrox-core`
# unpublishable. The crate is still a beachhead and its description and
# README say so.

[dependencies]
thiserror = { workspace = true }

# Vulkan via ash's `loaded` feature: `libvulkan` is opened with dlopen at
# RUNTIME, so no Vulkan SDK, no C++ toolchain and no linker flags are
# needed to *build* this crate. This is the same shape `ferrox-cuda`
# chose for cudarc, and for the same reason: `cargo build --features
# vulkan` must succeed on a machine with no driver at all.
#
# `ash` itself is a thin FFI binding: its only non-optional dependency
# is `libloading`. There is no build script, no bindgen, no vendored
# C++. That is the whole reason `ash` is named here rather than
# `vulkano` (which layers a large safe-abstraction crate on top) or
# `wgpu` (which is an entire second graphics abstraction, and would
# decide ferrox's backend design for it).
ash = { version = "0.38", optional = true, default-features = false, features = [
    "loaded",
    "std",
] }

[dev-dependencies]
ferrox-quant = { workspace = true }
half = { workspace = true }

[features]
default = []
# Real Vulkan dispatch. Builds without a driver present; see the `ash`
# comment above. The SPIR-V half of this crate is compiled and tested
# UNCONDITIONALLY, so a broken shader fails `cargo test -p
# ferrox-vulkan` on a machine with no Vulkan at all.
vulkan = ["dep:ash"]

# The one command to run before believing anything else in this crate.
# Needs the feature that brings `ash` in, or there is nothing to probe.
[[example]]
name = "probe"
required-features = ["vulkan"]
